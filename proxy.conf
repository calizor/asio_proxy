# proxy.conf — domain routing rules for the HTTPS MITM proxy
#
# Sections:
#   [tunnel]  — domains routed to a blind TCP tunnel (no MITM).
#               Use for pinned certs, OCSP, financial apps, messengers.
#   [mitm]    — explicit MITM allowlist (optional).
#               If this section is present and non-empty, ONLY listed
#               domains are intercepted; everything else is tunnelled.
#               If this section is absent or empty, all non-tunnelled
#               domains go through MITM (default behaviour).
#
# A domain entry matches the domain itself AND all its subdomains:
#   "example.com" matches "example.com" and "cdn.example.com"
#
# Lines starting with '#' and blank lines are ignored.
# Inline comments are supported: "paypal.com  # financial"

[tunnel]

# ── OCSP / CRL — certificate revocation infrastructure ──────────────────────
# These MUST be tunnelled: the proxy presents its own cert instead of the
# real one, which immediately breaks the revocation chain.
ocsp.digicert.com
ocsp.pki.goog
ocsp.comodoca.com
ocsp.usertrust.com
ocsp.sectigo.com
crl.microsoft.com
crl3.digicert.com
crl4.digicert.com

# ── OS / browser update servers ─────────────────────────────────────────────
update.googleapis.com
clients2.google.com
dl.google.com
update.microsoft.com
windowsupdate.microsoft.com
download.windowsupdate.com

# ── Financial services (strict certificate pinning) ──────────────────────────
paypal.com
braintreegateway.com
stripe.com
visa.com
mastercard.com

# ── Secure messaging ─────────────────────────────────────────────────────────
whatsapp.com
whatsapp.net
signal.org
telegram.org

# ── Apple services ───────────────────────────────────────────────────────────
apple.com
icloud.com
mzstatic.com


# [mitm]
# Uncomment and add domains here to switch to an explicit allowlist mode.
# Only listed domains will be intercepted; everything else will be tunnelled.
#
# github.com
# stackoverflow.com
